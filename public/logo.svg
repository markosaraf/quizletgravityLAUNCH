<?xml version="1.0" encoding="utf-8"?>
<!-- Quizlet-style Q icon — white Q on a blue rounded-square background.
     Used as the public/logo.svg asset (and as the source for favicon + apple-icon). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Q">
  <!-- Background: blue rounded square -->
  <rect width="256" height="256" rx="56" fill="#2563eb"/>

  <!-- Q outer ring -->
  <circle cx="128" cy="120" r="64" fill="none" stroke="#ffffff" stroke-width="22"/>

  <!-- Q tail (bottom-right diagonal stroke) -->
  <line x1="172" y1="168" x2="216" y2="212" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
</svg>
